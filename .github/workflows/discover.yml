# The single definition of "what packages exist" and "where do we build them",
# reused by check.yml, update.yml and stale.yml.
#
# It asks the flake rather than listing packages/ in shell, deliberately: the
# discovery rule lives in flake.nix, and a second copy of it here would be free
# to disagree — CI would then quietly test a different set than the flake ships.
name: discover

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      packages:
        description: JSON array of package names
        value: ${{ jobs.discover.outputs.packages }}
      vmtests:
        description: JSON array of NixOS VM test names
        value: ${{ jobs.discover.outputs.vmtests }}
      targets:
        description: JSON array of { runner, system } to build on
        value: ${{ jobs.discover.outputs.targets }}
      unredistributable:
        description: Regex of store paths that must not reach the public cache
        value: ${{ jobs.discover.outputs.unredistributable }}
      images:
        description: JSON array of OCI image names (Linux only)
        value: ${{ jobs.discover.outputs.images }}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.list }}
      vmtests: ${{ steps.vmtests.outputs.list }}
      targets: ${{ steps.targets.outputs.list }}
      unredistributable: ${{ steps.unredistributable.outputs.regex }}
      images: ${{ steps.images.outputs.list }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - id: packages
        run: |
          list=$(nix eval --json '.#packages.x86_64-linux' --apply builtins.attrNames)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "packages: $list"

      # What the licence forbids serving to others. A package says so through
      # passthru.redistributable (flake.nix, from meta.license); this turns the
      # answer into the pushFilter every Cachix step applies, so an unfree
      # package is built and tested like any other and never leaves the runner.
      # Store paths carry the pname, so `-ztreamer-` catches the package and
      # its vendored sources alike. (The ${n} below is Nix, hence the
      # shellcheck directive.)
      - id: unredistributable
        run: |
          # shellcheck disable=SC2016
          regex=$(nix eval --raw '.#packages.x86_64-linux' --apply 'ps:
            builtins.concatStringsSep "|" (map (n: "-" + n + "-")
              (builtins.filter (n: !ps.${n}.redistributable) (builtins.attrNames ps)))')
          echo "regex=$regex" >> "$GITHUB_OUTPUT"
          echo "not pushed: ${regex:-nothing}"

      - id: images
        run: |
          list=$(nix eval --json '.#images.x86_64-linux' --apply builtins.attrNames)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "images: $list"

      - id: vmtests
        run: |
          list=$(nix eval --json '.#nixosTests.x86_64-linux' --apply builtins.attrNames)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "vm tests: $list"

      # Two switches, both on: the runners exist as repository variables
      # because their cost depends on the plan (macOS is billed at 10x on a
      # private free-plan org and free on a public repository), and because
      # turning one off must be a deliberate act with a name. Whatever runs
      # here defines what meta.platforms may honestly claim: a system leaves
      # this list, and it leaves every package's platforms list with it.
      - id: targets
        env:
          ARM_LINUX: ${{ vars.CI_ARM_LINUX }}
          MACOS: ${{ vars.CI_MACOS }}
        run: |
          list='[{"runner":"ubuntu-latest","system":"x86_64-linux"}'
          if [ "$ARM_LINUX" = "true" ]; then
            list="$list"',{"runner":"ubuntu-24.04-arm","system":"aarch64-linux"}'
          fi
          if [ "$MACOS" = "true" ]; then
            list="$list"',{"runner":"macos-14","system":"aarch64-darwin"}'
          fi
          list="$list]"
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "targets: $list"
