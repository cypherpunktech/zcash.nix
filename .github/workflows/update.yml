# Version bumps, one PR per package, merged by auto-merge once green.
#
# The design constraint is negative: this workflow must never be able to fail
# quietly. helium-flake's updater closed and deleted its own branch on every
# error, so three months of total failure looked exactly like three months of
# "nothing to update". So: no branch deletion on failure, no `|| true`. A
# broken bump leaves a red job and a branch you can look at, and stale.yml
# independently asserts that bumps are actually happening.
#
# The gate that stands in for a reader: builds on every claimed platform, the
# binary runs, the VM tests pass, the tag verifies where upstream signs. A red
# run leaves the PR open with the failure on it.
name: update

on:
  schedule:
    # Daily, not weekly: zakura ships several releases in a busy week, and a
    # fleet following this flake can be no fresher than its last run.
    - cron: "37 4 * * *"
  workflow_dispatch:

# Everything that writes uses the app token below, not this one.
permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  discover:
    uses: ./.github/workflows/discover.yml

  update:
    needs: discover
    name: update ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      # One package's upstream breaking must not stop the other five from
      # getting their bumps.
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    timeout-minutes: 300
    env:
      PKG: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix

      - name: Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: cypherpunktech
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # No push without a token, none from a run in which any package's
          # licence forbids it: see `pushable` in discover.yml.
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' || needs.discover.outputs.pushable != 'true' }}

      # nix-update rewrites version, src hash and cargoHash in place, finding
      # the file through meta.position. It builds to discover the new hashes,
      # so a bump that cannot build fails here — which is the point.
      # Two kinds of pin need two strategies, and the pin itself says which:
      # a package tracking releases is pinned to refs/tags/*, one whose upstream
      # cuts no releases is pinned to a bare commit. Asking nix-update for a
      # "stable" version of a project that has never tagged one fails every
      # week, and a weekly red job for a package behaving correctly is exactly
      # the noise that trains people to ignore the alarm. check-staleness.sh
      # branches on the same field for the same reason.
      #
      # `--version=` here is nix-update's TARGET, not a request to print its own.
      - name: Bump the pin
        run: |
          rev=$(nix eval --raw ".#\"$PKG\".src.rev")
          tag=${rev#refs/tags/}
          if [ "$tag" = "$rev" ]; then
            # Not a tag at all: a bare commit, because upstream cuts no releases.
            target=branch
          elif [[ "$tag" =~ [0-9][-+][0-9A-Za-z.-]+$ ]]; then
            # A semver pre-release or build suffix after the version core, e.g.
            # v0.1.0-beta.3. GitHub does not flag these as prereleases and
            # check-staleness.sh therefore treats them as current, but
            # nix-update applies semver rules and refuses them under `stable`
            # with "Found an unstable version ... please use '--version=unstable'".
            # Two tools, two definitions of stable; this is where they are
            # reconciled. The [0-9] before the separator is load-bearing: it
            # keeps a name like zebra-utils-v10.0.1 out of this branch.
            target=unstable
          else
            target=stable
          fi
          # A tagged pin is `v?<version>` in every package here, so only a tag of
          # that shape is a candidate. Without this nix-update took zaino's
          # `backup/pre-nfs-greenfield-20260920` for a release (#8).
          regex=()
          [ "$target" = branch ] || regex=(--version-regex '^v?([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)$')
          echo "bumping $PKG (tag: $tag) toward: $target"
          nix develop --command nix-update --flake --version="$target" "${regex[@]}" "$PKG"

      - name: Did anything change?
        id: changed
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "already on the newest release"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(nix eval --raw ".#\"$PKG\".version")" >> "$GITHUB_OUTPUT"
            git --no-pager diff
          fi

      # Before building anything from it: where upstream signs its tags, the
      # new tag must carry the maintainer's signature and hash to the source
      # nix-update just pinned. A moved tag or a tampered tarball stops here,
      # as a red job with the reason in it, never as a PR.
      - name: Verify the new source is what the maintainer signed
        if: steps.changed.outputs.changed == 'true'
        env:
          PACKAGES: ${{ matrix.package }}
          SYSTEM: x86_64-linux
        run: nix run .#verify

      # A bump that builds but produces a binary that cannot start is exactly
      # the breakage a version PR should catch, so the smoke check gates the PR
      # rather than only running after merge.
      - name: Smoke test — runs the new binary
        if: steps.changed.outputs.changed == 'true'
        run: nix build -L ".#checks.x86_64-linux.\"smoke-$PKG\""

      # The repository's app, not GITHUB_TOKEN: GitHub starts no workflow
      # for anything GITHUB_TOKEN does, so the PR it opened had no checks and
      # the merge it made never ran check.yml on main. No pin, no images, and
      # published.yml red until the next human push. The app's actions are
      # ordinary events.
      - name: App token
        id: app
        if: steps.changed.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      # The PR is the record and the merge below is its reader: the full
      # matrix, the VM tests and the provenance check stand in for a human,
      # and stale.yml asserts the outcome. delete-branch stays false so a
      # failed run leaves evidence behind instead of tidying itself away.
      - name: Open PR
        id: pr
        if: steps.changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Explicit, because the checkout above sets persist-credentials:
          # false. This action authenticates with its own token input rather
          # than credentials left in .git/config, which is the combination its
          # docs recommend -- but relying on the default here would make the
          # workflow's correctness depend on a default we deliberately removed.
          token: ${{ steps.app.outputs.token }}
          branch: update/${{ matrix.package }}
          delete-branch: false
          title: "update(${{ matrix.package }}): ${{ steps.changed.outputs.version }}"
          commit-message: "update(${{ matrix.package }}): ${{ steps.changed.outputs.version }}"
          body: |
            Automated version bump by `nix-update`.

            Built and smoke-tested on x86_64-linux by this run. The full
            matrix, VM tests included, runs on this branch via `check.yml`,
            and the PR merges itself when that is green.

      # The PR's own check.yml run is the gate: the ruleset holds the merge
      # until `ci` is green, and a red run leaves the PR open with the reason
      # on it. The merge is the app's, so main's push runs check.yml there,
      # which pins the cache and publishes the images.
      - name: Merge when green
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "$PR"
