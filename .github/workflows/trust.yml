# Two claims about the source, each written as something that can go red.
#
# advisories: no lockfile we build from names a dependency with a published
# vulnerability, except the ones scripts/advisories-accepted.txt records with
# a reason and a date. A pin does not change when an advisory is published, so
# no other gate here can notice one. Every advisory in that file is in a
# dependency of an upstream's own committed lockfile, where the only fix is
# their next release: red every day for a month is how a gate stops being
# read on the day something new appears. So this goes red when the set
# CHANGES -- a new advisory, or an acceptance out of time -- and the file is
# the honest list of what a node from here is running.
#
# provenance: where an upstream signs its release tags, the pinned tag carries
# the maintainer's signature and its tree is byte-for-byte the pinned source.
# Packages whose upstream signs nothing are listed as unsigned, which is the
# honest answer to "which of these sources are verified" and the list to take
# to those upstreams.
#
# sources: every hash typed into packages/ still re-fetches to the bytes it
# names. A fixed output's store path depends on its hash alone, so once it
# exists nothing ever runs the fetcher again -- a bumped tag with an old
# hash, or a hash pasted from a sibling, is green forever. `--rebuild` is
# the one thing that executes it; scripts/check-fods.sh does that for each.
#
# All three are scripts, not derivations: each needs the network -- an
# advisory database, a git remote, upstream's tarballs -- and each can be
# rerun by anyone in a minute: `just audit`, `just verify`, `just fods`. They
# run as flake apps so the tools they call are the lock's. Daily, cheap:
# sources and one cached binary.
name: trust

permissions:
  contents: read

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/check-advisories.sh
      - scripts/advisories-accepted.txt
      - scripts/verify-upstream.sh
      - scripts/check-fods.sh
      - "packages/*/allowed_signers"
      - .github/workflows/trust.yml

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      # Pull only: govulncheck wants the built lightwalletd, which check.yml
      # already pushed.
      - name: Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: cypherpunktech
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      # The auditors come from the flake's own pinned nixpkgs (flake.nix
      # `commands`), so a run is reproducible against the lockfile.
      - run: nix run .#audit

  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      # git and ssh-keygen are the security property here; they come from
      # the lock, not the runner image.
      - run: nix run .#verify

  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      # Pull only: the point is to re-fetch what the cache already serves and
      # see the same bytes, so the reference must come from the cache.
      - name: Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: cypherpunktech
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - run: nix run .#fods
        env:
          SYSTEM: x86_64-linux
